<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Gull Run: Evo</title>
  <style>
    html,body{margin:0;height:100%;background:#071329;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;font-weight:800}
  </style>
</head>
<body>
  Loading Gull Run: Evo…
  <script>
    const gameParts=["game-v9-part00.txt","game-v9-part01.txt","game-v9-part02.txt","game-v9-part03.txt","game-v9-part04.txt","game-v9-part05.txt","game-v9-part06.txt","game-v9-part07.txt","game-v9-part08.txt","game-v9-part09.txt","game-v9-part10.txt","game-v9-part11.txt","game-v9-part12.txt"];
    const expansionPaths=["worldtour-expansion.js?v=20260907c","approved-scenes.js?v=20260907c","stage-foods.js?v=20260907c","performance-patch.js?v=20260907c"];
    Promise.all([
      Promise.all(gameParts.map(path=>fetch(path,{cache:'no-store'}).then(response=>{
        if(!response.ok) throw new Error(`Failed to load ${path}`);
        return response.text();
      }))),
      Promise.all(expansionPaths.map(path=>fetch(path,{cache:'no-store'}).then(response=>{
        if(!response.ok) throw new Error(`Failed to load ${path}`);
        return response.text();
      })))
    ]).then(([parts,expansions])=>{
      const closingIife='})();';
      const html=parts.join('');
      const at=html.lastIndexOf(closingIife);
      if(at<0) throw new Error('Game injection point not found');
      const injected='\n/* WORLD TOUR EXPANSION START */\n'+expansions[0]+'\n/* WORLD TOUR EXPANSION END */\n/* APPROVED SCENES START */\n'+expansions[1]+'\n/* APPROVED SCENES END */\n/* STAGE FOODS START */\n'+expansions[2]+'\n/* STAGE FOODS END */\n/* PERFORMANCE PATCH START */\n'+expansions[3]+'\n/* PERFORMANCE PATCH END */\n';
      const patched=html.slice(0,at)+injected+html.slice(at);
      document.open();
      document.write(patched);
      document.close();
    }).catch(error=>{
      console.error(error);
      document.body.textContent='Could not load the game. Refresh to try again.';
    });
  </script>
</body>
</html>
