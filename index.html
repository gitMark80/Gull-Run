<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gull Run: Evo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#58b8e8;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
canvas{width:100%;height:100%;display:block}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 3px #17394d;font-weight:900}
.top{position:absolute;top:max(6px,env(safe-area-inset-top));left:7px;right:7px;display:grid;grid-template-columns:1fr auto 1fr;gap:6px}
.badge{background:#163b5edb;border:1px solid #ffffffaa;border-radius:10px;padding:5px 8px;font-size:11px}
.stage{text-align:center}.right{text-align:right}
.bars{position:absolute;top:max(38px,calc(env(safe-area-inset-top) + 38px));left:7px;width:min(270px,68vw);display:grid;gap:4px}
.bar{height:12px;border-radius:99px;overflow:hidden;background:#173d5dcc;border:1px solid #ffffff88;position:relative}.fill{height:100%}.hp{background:#48d16c}.xp{background:#f4ca48}.lab{position:absolute;inset:0;display:grid;place-items:center;font-size:8px}
.tip{position:absolute;bottom:max(7px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#173d5dcc;border-radius:99px;padding:5px 9px;font-size:10px;white-space:nowrap}
#joy{display:none;position:fixed;left:18px;bottom:max(22px,calc(env(safe-area-inset-bottom) + 22px));width:108px;height:108px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff77}
#knob{position:absolute;left:33px;top:33px;width:40px;height:40px;border-radius:50%;background:#ffffffcc;border:2px solid #fff}
#overlay{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:#0a254766}
.card{width:min(92vw,440px);background:#fffaf0f5;border:4px solid #263f59;border-radius:25px;padding:20px;text-align:center;color:#203b4b;box-shadow:0 10px 0 #263f59}
h1{font-size:40px;line-height:.92;margin:0;color:#e55c46;text-shadow:0 3px #ffd765}
p{font-weight:750;line-height:1.4}
button{border:3px solid #7e2e28;border-radius:15px;padding:11px 18px;background:#e75c48;color:#fff;font-size:17px;font-weight:900}
.small{font-size:11px;opacity:.8;margin-top:10px}
@media(pointer:coarse){#joy{display:block}}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="hud" class="hidden">
  <div class="top">
    <div class="badge">SCORE <span id="score">0</span></div>
    <div class="badge stage" id="stage">Gull</div>
    <div class="badge right">BEST <span id="best">0</span></div>
  </div>
  <div class="bars">
    <div class="bar"><div class="fill hp" id="hp"></div><div class="lab">HEALTH <span id="ht">100</span></div></div>
    <div class="bar"><div class="fill xp" id="xp"></div><div class="lab">EVOLUTION <span id="xt">0 / 15</span></div></div>
  </div>
  <div class="tip">Green = edible • Red = danger • Mech Dragon auto-lasers UFOs</div>
</div>
<div id="joy"><div id="knob"></div></div>
<div id="overlay"><div class="card">
  <h1>GULL RUN<br>EVO</h1>
  <p id="msg">Eat. Grow. Fight. Evolve from a gull into a laser-firing Mech Dragon.</p>
  <button id="play">PLAY</button>
  <div class="small">Desktop: hold mouse toward where you want to fly. Mobile: joystick. Hitting the top or bottom hurts.</div>
</div></div>
<script>
(()=>{
const c=document.querySelector('#g'),ctx=c.getContext('2d');
const hud=document.querySelector('#hud'),ov=document.querySelector('#overlay'),play=document.querySelector('#play'),msg=document.querySelector('#msg');
const sc=document.querySelector('#score'),be=document.querySelector('#best'),se=document.querySelector('#stage'),hp=document.querySelector('#hp'),ht=document.querySelector('#ht'),xp=document.querySelector('#xp'),xt=document.querySelector('#xt');
const joy=document.querySelector('#joy'),knob=document.querySelector('#knob');
let W=390,H=844,D=1,last=0,t=0,run=false,score=0,best=+(localStorage.getItem('gullRunEvoBest')||0);
be.textContent=best;
const WORLD={w:5200,h:2800,space:760,sky:1450,ocean:1980,ground:2800};
const MEALS=15;
const STAGES=[
 {name:'Gull',size:20,speed:245,level:1,kind:'bird',body:'#f5f5f2',wing:'#b8c9d3',accent:'#f2b13d'},
 {name:'Pelican',size:26,speed:265,level:3,kind:'bird',body:'#efe6d5',wing:'#c8bfae',accent:'#ef9e42'},
 {name:'Osprey',size:32,speed:290,level:5,kind:'bird',body:'#8b6848',wing:'#5a4332',accent:'#ece4d5'},
 {name:'Bald Eagle',size:38,speed:315,level:7,kind:'bird',body:'#4b3528',wing:'#34251f',accent:'#f3f0e7'},
 {name:'Pterodactyl',size:45,speed:340,level:9,kind:'ptero',body:'#a36f42',wing:'#7a4e30',accent:'#e1bd79'},
 {name:'Green Dragon',size:53,speed:360,level:12,kind:'dragon',body:'#4f9b42',wing:'#2f7138',accent:'#c7e55a'},
 {name:'Mech Dragon',size:62,speed:385,level:15,kind:'mech',body:'#36404c',wing:'#1f2933',accent:'#76ff5f'}
].map((s,i)=>({...s,need:(i+1)*MEALS}));
const FOOD=[
 ['fish',2,15],['burger',3,18],['ham',4,19],['hotdog',3,17],['pizza',3,18],['steak',5,20],['cake',4,18],['fries',2,16],['donut',2,16],['icecream',2,16]
];
const FLYING=[
 ['Black Crow',2,22,'bird','#20252d','#0e1116','#6c7077'],
 ['Raven',3,24,'bird','#151a22','#090c11','#687080'],
 ['Bat',4,23,'bat','#3f3444','#201927','#a788a6'],
 ['Vampire Bat',5,27,'bat','#2a2530','#17121d','#c74245'],
 ['Mosquito',5,17,'bug','#666b74','#bfc8d1','#db5d55'],
 ['Wasp',6,20,'bug','#e8b628','#28251d','#f6d75b'],
 ['Hornet',7,22,'bug','#d18b20','#211b15','#f0c04e'],
 ['Vulture',8,34,'bird','#5b4b42','#332b27','#d16f5c'],
 ['Condor',10,39,'bird','#2d3034','#17191b','#ece6dd'],
 ['Evil Seagull',11,32,'bird','#e9ecef','#8ea0ad','#f1ab38'],
 ['Pteranodon',12,42,'ptero','#85583a','#5e3928','#caa56d'],
 ['Winged Germ',14,26,'germ','#79c657','#4f9445','#b98ce2']
];
const R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let p,cam={x:0,y:0},foods=[],enemies=[],ufos=[],boats=[],grounds=[],planes=[],clouds=[],stars=[],parts=[],lasers=[];
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.6);c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=true}
addEventListener('resize',resize,{passive:true});resize();
const keys={}; addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow')||e.code==='Space')e.preventDefault()}); addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let mouse={down:false,x:0,y:0}; c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){mouse.down=true;mouse.x=e.clientX;mouse.y=e.clientY}}); c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){mouse.x=e.clientX;mouse.y=e.clientY}}); c.addEventListener('pointerup',()=>mouse.down=false); c.addEventListener('pointercancel',()=>mouse.down=false);
let j={x:0,y:0},jid=null;
function jm(e){let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,z=Math.hypot(dx,dy)||1,m=Math.min(1,z/42);j={x:dx/z*m,y:dy/z*m};knob.style.transform=`translate(${j.x*33}px,${j.y*33}px)`}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
function je(e){if(e.pointerId!==jid)return;jid=null;j={x:0,y:0};knob.style.transform=''} joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);
function foodObj(i){let f=FOOD[i%FOOD.length],z=Math.random(),y=z<.25?R(WORLD.space+80,WORLD.sky-120):z<.6?R(WORLD.sky-80,WORLD.ocean-110):R(WORLD.ocean+120,WORLD.ground-130);return{type:f[0],xp:f[1],r:f[2],x:R(100,WORLD.w-100),y,ph:R(0,7)}}
function enemyObj(i){let k=FLYING[i%FLYING.length];return{name:k[0],level:k[1],r:k[2],kind:k[3],body:k[4],wing:k[5],accent:k[6],x:R(100,WORLD.w-100),y:R(WORLD.space+100,WORLD.sky+280),vx:R(-90,90),vy:R(-45,45),hp:65+k[1]*13,max:65+k[1]*13,ph:R(0,7)}}
function groundObj(i){let kinds=['alligator','gorilla','soldier','tank'];return{kind:kinds[i%kinds.length],x:R(120,WORLD.w-120),y:R(WORLD.ocean+350,WORLD.ground-70),ph:R(0,7),r:kinds[i%kinds.length]==='gorilla'?45:40}}
function fill(){foods=Array.from({length:85},(_,i)=>foodObj(i));enemies=Array.from({length:42},(_,i)=>enemyObj(i));ufos=Array.from({length:10},()=>({x:R(120,WORLD.w-120),y:R(100,WORLD.space-100),r:R(32,45),vx:R(-60,60),hp:2,ph:R(0,7),beam:0}));boats=Array.from({length:10},(_,i)=>({type:i%2?'speed':'sail',x:R(0,WORLD.w),y:R(WORLD.sky+300,WORLD.ocean-95),dir:Math.random()<.5?-1:1,v:R(35,95),ph:R(0,7)}));grounds=Array.from({length:24},(_,i)=>groundObj(i));planes=[];clouds=Array.from({length:38},()=>({x:R(0,WORLD.w),y:R(WORLD.space+80,WORLD.sky-120),s:R(30,90),ph:R(0,7)}));stars=Array.from({length:190},()=>({x:R(0,WORLD.w),y:R(20,WORLD.space+40),r:R(.7,2.1),ph:R(0,7)}));parts=[];lasers=[]}
function reset(){p={x:560,y:WORLD.sky-220,vx:0,vy:0,stage:0,xp:0,hp:100,inv:0,wing:0,edgeCd:0,laserCd:0};score=0;sc.textContent='0';fill();run=true;ov.classList.add('hidden');hud.classList.remove('hidden');HUD()}
play.onclick=reset;
function HUD(){let s=STAGES[p.stage],prev=p.stage?STAGES[p.stage-1].need:0,span=s.need-prev,local=p.xp-prev;se.textContent=s.name;ht.textContent=Math.ceil(p.hp);hp.style.width=C(p.hp,0,100)+'%';xt.textContent=p.stage===STAGES.length-1?'MAX':`${Math.max(0,Math.floor(local))} / ${span}`;xp.style.width=p.stage===STAGES.length-1?'100%':C(local/span*100,0,100)+'%'}
function burst(X,Y,col,n=9){for(let i=0;i<n;i++)parts.push({x:X,y:Y,vx:R(-120,120),vy:R(-120,120),life:R(.3,.8),col})}
function hurt(n,q){if(p.inv)return;p.hp-=n;p.inv=.65;if(q){let dx=p.x-q.x,dy=p.y-q.y,z=Math.hypot(dx,dy)||1;p.vx+=dx/z*180;p.vy+=dy/z*180}burst(p.x,p.y,'#ff665f',12);if(p.hp<=0){run=false;hud.classList.add('hidden');ov.classList.remove('hidden');if(score>best){best=score;localStorage.setItem('gullRunEvoBest',best);be.textContent=best}msg.textContent=`You reached ${STAGES[p.stage].name} with ${score} points.`;play.textContent='PLAY AGAIN'}}
function evolve(){while(p.stage<STAGES.length-1&&p.xp>=STAGES[p.stage].need){p.stage++;p.hp=Math.min(100,p.hp+30);burst(p.x,p.y,'#ffe762',30)}}
const edible=e=>STAGES[p.stage].level>=e.level+2||STAGES[p.stage].kind==='mech';
function update(dt){t+=dt;if(!run)return;let s=STAGES[p.stage];let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+j.x;let dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+j.y;let active=Math.abs(dx)+Math.abs(dy)>.05;if(mouse.down){let ax=cam.x+mouse.x-p.x,ay=cam.y+mouse.y-p.y,z=Math.hypot(ax,ay)||1;dx+=ax/z;dy+=ay/z;active=true}let z=Math.hypot(dx,dy);if(z>1){dx/=z;dy/=z}if(active){let k=1-Math.pow(.0005,dt);p.vx+=(dx*s.speed-p.vx)*k;p.vy+=(dy*s.speed-p.vy)*k}else{p.vx*=Math.pow(.15,dt);p.vy+=565*dt}p.vy+=16*dt;z=Math.hypot(p.vx,p.vy);if(z>s.speed){p.vx=p.vx/z*s.speed;p.vy=p.vy/z*s.speed}p.x=C(p.x+p.vx*dt,45,WORLD.w-45);p.y+=p.vy*dt;p.wing+=dt*(active?13:9);p.inv=Math.max(0,p.inv-dt);p.edgeCd=Math.max(0,p.edgeCd-dt);p.laserCd=Math.max(0,p.laserCd-dt);if(p.y<38){p.y=38;p.vy=Math.abs(p.vy)*.55;if(!p.edgeCd){hurt(9,{x:p.x,y:0});p.edgeCd=.7}}if(p.y>WORLD.h-42){p.y=WORLD.h-42;p.vy=-Math.abs(p.vy)*.55;if(!p.edgeCd){hurt(9,{x:p.x,y:WORLD.h});p.edgeCd=.7}}for(let i=foods.length-1;i>=0;i--){let f=foods[i];f.ph+=dt;if(dist(p,f)<s.size+f.r+5){p.xp+=1;score+=f.xp*15;sc.textContent=score;burst(f.x,f.y,'#ffd766',8);foods[i]=foodObj(Math.floor(R(0,FOOD.length)));evolve()}}for(let e of enemies){e.ph+=dt*8;let d=dist(p,e);if(d<390&&!edible(e)){e.vx+=(p.x-e.x)/(d||1)*95*dt;e.vy+=(p.y-e.y)/(d||1)*75*dt}else if(d<250&&edible(e)){e.vx-=(p.x-e.x)/(d||1)*55*dt;e.vy-=(p.y-e.y)/(d||1)*40*dt}let sp=Math.hypot(e.vx,e.vy),mx=110+e.level*5;if(sp>mx){e.vx=e.vx/sp*mx;e.vy=e.vy/sp*mx}e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.x<30||e.x>WORLD.w-30)e.vx*=-1;if(e.y<WORLD.space+20||e.y>WORLD.sky+330)e.vy*=-1;if(d<s.size+e.r*.8){if(edible(e)){e.hp-=25+s.level*4;if(e.hp<=0){p.xp+=1;score+=80+e.level*25;sc.textContent=score;Object.assign(e,enemyObj(Math.floor(R(0,FLYING.length*3))));evolve()}}else hurt(10+e.level*.7,e)}}for(let g of grounds){g.ph+=dt;let d=dist(p,g);if(d<s.size+g.r*.85)hurt(g.kind==='tank'?20:15,g)}for(let u of ufos){u.ph+=dt*2;u.x+=u.vx*dt;if(u.x<50||u.x>WORLD.w-50)u.vx*=-1;u.beam=Math.max(0,u.beam-dt);let d=dist(p,u);if(p.y<WORLD.space+120&&d<320&&Math.random()<dt*.18)u.beam=.45;if(u.beam&&Math.abs(p.x-u.x)<42&&p.y>u.y&&p.y<u.y+260)hurt(8,u);if(d<s.size+u.r*.7)hurt(14,u)}if(s.kind==='mech'&&!p.laserCd&&ufos.length){let target=null,bd=700;for(let u of ufos){let d=dist(p,u);if(d<bd){bd=d;target=u}}if(target){target.hp--;lasers.push({x1:p.x,y1:p.y-8,x2:target.x,y2:target.y,life:.14});p.laserCd=.34;burst(target.x,target.y,'#a8ff70',5);if(target.hp<=0){score+=350;sc.textContent=score;burst(target.x,target.y,'#ffb348',26);Object.assign(target,{x:R(100,WORLD.w-100),y:R(80,WORLD.space-100),r:R(32,45),vx:R(-60,60),hp:2,ph:R(0,7),beam:0})}}}for(let b of boats){b.ph+=dt*1.6;b.x+=b.dir*b.v*dt;let w=b.type==='sail'?150:125;if(b.x<-w-70)b.x=WORLD.w+70;if(b.x>WORLD.w+70)b.x=-w-70;if(p.y>b.y-90&&p.y<b.y+38&&p.x>b.x&&p.x<b.x+w)hurt(17,b)}if(Math.random()<dt*.012)planes.push({x:-220,y:R(WORLD.space+120,WORLD.sky-160),v:R(200,285)});for(let i=planes.length-1;i>=0;i--){planes[i].x+=planes[i].v*dt;if(planes[i].x>WORLD.w+260)planes.splice(i,1)}for(let i=parts.length-1;i>=0;i--){let q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.life<=0)parts.splice(i,1)}for(let i=lasers.length-1;i>=0;i--){lasers[i].life-=dt;if(lasers[i].life<=0)lasers.splice(i,1)}cam.x=C(p.x-W/2,0,Math.max(0,WORLD.w-W));cam.y=C(p.y-H/2,0,Math.max(0,WORLD.h-H));HUD()}
function scr(o){return{x:o.x-cam.x,y:o.y-cam.y}}
function outline(q,rx,ry,color){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=4;ctx.globalAlpha=.95;ctx.beginPath();ctx.ellipse(q.x,q.y,rx,ry,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=.15;ctx.lineWidth=10;ctx.stroke();ctx.restore()}
function bg(){let g=ctx.createLinearGradient(0,-cam.y,0,WORLD.sky-cam.y);g.addColorStop(0,'#07172c');g.addColorStop(.38,'#215086');g.addColorStop(.75,'#6ec0e5');g.addColorStop(1,'#d9f3ff');ctx.fillStyle=g;ctx.fillRect(0,-cam.y,W,WORLD.sky);let sy=WORLD.sky-cam.y,oy=WORLD.ocean-cam.y,og=ctx.createLinearGradient(0,sy,0,oy);og.addColorStop(0,'#60b9df');og.addColorStop(1,'#16658f');ctx.fillStyle=og;ctx.fillRect(0,sy,W,WORLD.ocean-WORLD.sky);let gg=ctx.createLinearGradient(0,oy,0,WORLD.ground-cam.y);gg.addColorStop(0,'#e6c77e');gg.addColorStop(.16,'#79b95b');gg.addColorStop(1,'#397744');ctx.fillStyle=gg;ctx.fillRect(0,oy,W,WORLD.ground-WORLD.ocean);for(let s of stars){let q=scr(s);if(q.x<0||q.x>W||q.y<0||q.y>H)continue;ctx.globalAlpha=.55+.35*Math.sin(t*2+s.ph);ctx.fillStyle='#fff7c7';ctx.beginPath();ctx.arc(q.x,q.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(let c0 of clouds){let q=scr(c0);if(q.x<-180||q.x>W+180||q.y<-100||q.y>H+100)continue;let s=c0.s;ctx.fillStyle='#ffffffe4';ctx.beginPath();ctx.arc(q.x-s*.5,q.y,s*.36,0,7);ctx.arc(q.x,q.y-s*.18,s*.56,0,7);ctx.arc(q.x+s*.55,q.y,s*.4,0,7);ctx.fill()}}
const flapAngles=[-1.12,-.58,-.08,.62];
function drawWingPair(r,wing,kind,phase,mech=false){let a=flapAngles[phase%4];ctx.save();ctx.rotate(a);ctx.fillStyle=wing;ctx.strokeStyle=mech?'#0b1016':'#283642';ctx.lineWidth=Math.max(2.2,r*.08);ctx.beginPath();ctx.moveTo(-r*.12,0);ctx.quadraticCurveTo(-r*.9,-r*.6,-r*1.25,-r*.12);ctx.quadraticCurveTo(-r*.85,r*.3,-r*.08,r*.28);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();ctx.save();ctx.rotate(-a*.82);ctx.fillStyle=wing;ctx.strokeStyle=mech?'#0b1016':'#283642';ctx.lineWidth=Math.max(2.2,r*.08);ctx.beginPath();ctx.moveTo(r*.1,0);ctx.quadraticCurveTo(r*.82,-r*.56,r*1.18,-r*.1);ctx.quadraticCurveTo(r*.8,r*.3,r*.06,r*.28);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function drawBirdBody(r,body,accent,kind,phase,mech=false){drawWingPair(r,kind==='mech'?'#1f2b35':kind==='dragon'?'#2f7138':kind==='ptero'?'#7a4e30':kind==='bat'?'#211a28':body,kind,phase,mech);ctx.strokeStyle=mech?'#0d141b':'#263642';ctx.lineWidth=Math.max(2.2,r*.08);if(kind==='ptero'||kind==='dragon'||kind==='mech'){ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,0,r*.85,r*.42,0,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(r*.45,-r*.13);ctx.quadraticCurveTo(r*1.15,-r*.4,r*1.5,-r*.08);ctx.lineTo(r*.7,r*.18);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-r*.65,0);ctx.quadraticCurveTo(-r*1.25,r*.2,-r*1.55,r*.55);ctx.stroke();if(kind==='dragon'||kind==='mech'){ctx.fillStyle=accent;ctx.beginPath();ctx.arc(r*.92,-r*.14,4.5,0,7);ctx.fill()}if(kind==='mech'){ctx.fillStyle='#7eff66';ctx.fillRect(-r*.3,-r*.13,r*.42,r*.22);ctx.fillStyle='#7a8794';for(let i=-2;i<=2;i++){ctx.fillRect(i*r*.18,-r*.55,4,r*.22)}}}else{ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,0,r,r*.62,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle=accent;ctx.beginPath();ctx.ellipse(r*.58,-r*.22,r*.48,r*.43,-.05,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(r*.73,-r*.3,Math.max(3,r*.13),0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(r*.77,-r*.3,Math.max(1.6,r*.055),0,7);ctx.fill();ctx.fillStyle='#f0a53c';ctx.beginPath();ctx.moveTo(r*.95,-r*.12);ctx.lineTo(r*1.45,0);ctx.lineTo(r*.95,r*.11);ctx.closePath();ctx.fill();ctx.stroke()}}
function drawPlayer(){if(!p)return;let s=STAGES[p.stage],q=scr(p),phase=Math.floor(p.wing)%4,flip=p.vx<0,alpha=p.inv&&Math.floor(p.inv*14)%2===0?.35:1;outline(q,s.size*1.45,s.size*1.1,'#39db6d');ctx.save();ctx.translate(q.x,q.y);ctx.scale(flip?-1:1,1);ctx.globalAlpha=alpha;ctx.rotate(Math.atan2(p.vy,p.vx||1)*.04);drawBirdBody(s.size,s.body,s.accent,s.kind,phase,s.kind==='mech');ctx.restore()}
function drawEnemy(e){let q=scr(e);if(q.x<-90||q.x>W+90||q.y<-90||q.y>H+90)return;let color=edible(e)?'#39db6d':'#ef4d57',phase=Math.floor(e.ph)%4;outline(q,e.r*1.35,e.r*1.05,color);ctx.save();ctx.translate(q.x,q.y);ctx.scale(e.vx<0?-1:1,1);if(e.kind==='bug'){ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.fillStyle=e.body;ctx.beginPath();ctx.ellipse(0,0,e.r*.65,e.r*.3,0,0,7);ctx.fill();ctx.stroke();for(let side of [-1,1]){ctx.save();ctx.scale(side,1);ctx.rotate(flapAngles[phase]*.55);ctx.fillStyle='#d8eef3bb';ctx.beginPath();ctx.ellipse(-e.r*.25,-e.r*.35,e.r*.75,e.r*.26,-.2,0,7);ctx.fill();ctx.stroke();ctx.restore()}}else if(e.kind==='germ'){drawWingPair(e.r,'#86d5e5','germ',phase);ctx.fillStyle=e.body;ctx.strokeStyle='#274930';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,e.r*.65,0,7);ctx.fill();ctx.stroke();for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(Math.cos(a)*e.r*.6,Math.sin(a)*e.r*.6);ctx.lineTo(Math.cos(a)*e.r*.95,Math.sin(a)*e.r*.95);ctx.stroke()}}else if(e.kind==='bat'){drawWingPair(e.r,e.wing,'bat',phase);ctx.fillStyle=e.body;ctx.strokeStyle='#1b1720';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(0,0,e.r*.65,e.r*.45,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle=e.accent;ctx.beginPath();ctx.moveTo(-8,-e.r*.35);ctx.lineTo(-3,-e.r*.75);ctx.lineTo(1,-e.r*.34);ctx.moveTo(5,-e.r*.34);ctx.lineTo(10,-e.r*.75);ctx.lineTo(14,-e.r*.3);ctx.fill()}else drawBirdBody(e.r,e.body,e.accent,e.kind,phase,false);ctx.restore();ctx.fillStyle='#173044bb';ctx.fillRect(q.x-19,q.y-e.r*1.55,38,6);ctx.fillStyle=color;ctx.fillRect(q.x-18,q.y-e.r*1.55+1,36*e.hp/e.max,4)}
function drawFood(f){let q=scr({x:f.x,y:f.y+Math.sin(f.ph)*5});if(q.x<-50||q.x>W+50||q.y<-50||q.y>H+50)return;outline(q,f.r*1.2,f.r,'#39db6d');ctx.save();ctx.translate(q.x,q.y);ctx.strokeStyle='#55392b';ctx.lineWidth=2;if(f.type==='fish'){ctx.fillStyle='#f39b33';ctx.beginPath();ctx.ellipse(0,0,14,8,0,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(-24,-9);ctx.lineTo(-24,9);ctx.closePath();ctx.fill();ctx.stroke()}else if(f.type==='burger'){ctx.fillStyle='#e0a24c';ctx.beginPath();ctx.arc(0,-3,16,Math.PI,0);ctx.lineTo(16,2);ctx.lineTo(-16,2);ctx.fill();ctx.stroke();ctx.fillStyle='#5fa34c';ctx.fillRect(-15,2,30,4);ctx.fillStyle='#7e3d2d';ctx.fillRect(-14,6,28,6);ctx.fillStyle='#e4aa3f';ctx.beginPath();ctx.arc(0,13,14,0,Math.PI);ctx.fill();ctx.stroke()}else if(f.type==='hotdog'){ctx.fillStyle='#e4a24a';ctx.beginPath();ctx.roundRect(-18,-8,36,16,8);ctx.fill();ctx.stroke();ctx.fillStyle='#c84b45';ctx.beginPath();ctx.roundRect(-15,-5,30,10,5);ctx.fill();ctx.stroke()}else if(f.type==='ham'){ctx.fillStyle='#d36b72';ctx.beginPath();ctx.ellipse(0,0,17,13,-.12,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#f3a3a8';ctx.beginPath();ctx.arc(6,-2,6,0,7);ctx.fill()}else if(f.type==='pizza'){ctx.fillStyle='#f0c55b';ctx.beginPath();ctx.moveTo(-16,12);ctx.lineTo(16,12);ctx.lineTo(0,-17);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#c84b43';ctx.beginPath();ctx.arc(-5,2,4,0,7);ctx.arc(6,5,4,0,7);ctx.fill()}else if(f.type==='steak'){ctx.fillStyle='#a9503d';ctx.beginPath();ctx.ellipse(0,0,18,12,.15,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#f4d4be';ctx.beginPath();ctx.ellipse(4,0,7,5,.15,0,7);ctx.fill()}else if(f.type==='cake'){ctx.fillStyle='#f2d8c0';ctx.fillRect(-15,-10,30,22);ctx.strokeRect(-15,-10,30,22);ctx.fillStyle='#df6582';ctx.fillRect(-15,-10,30,6);ctx.fillStyle='#f24c61';ctx.beginPath();ctx.arc(0,-13,5,0,7);ctx.fill()}else if(f.type==='fries'){ctx.fillStyle='#d84b38';ctx.fillRect(-12,-8,24,22);ctx.strokeRect(-12,-8,24,22);ctx.fillStyle='#f4c84c';for(let i=-8;i<=8;i+=4)ctx.fillRect(i,-18,3,15)}else if(f.type==='donut'){ctx.fillStyle='#e78ab0';ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.arc(0,0,5,0,7,true);ctx.fill('evenodd');ctx.stroke()}else{ctx.fillStyle='#f0a9c5';ctx.beginPath();ctx.arc(0,-8,10,0,7);ctx.fill();ctx.fillStyle='#d6a35e';ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(7,0);ctx.lineTo(0,17);ctx.closePath();ctx.fill();ctx.stroke()}ctx.restore()}
function drawUfo(u){let q=scr(u);if(q.x<-90||q.x>W+90||q.y<-90||q.y>H+290)return;outline(q,u.r*1.25,u.r*.75,'#ef4d57');ctx.save();ctx.translate(q.x,q.y);if(u.beam){let g=ctx.createLinearGradient(0,20,0,250);g.addColorStop(0,'#8effee66');g.addColorStop(1,'#8effee00');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-20,15);ctx.lineTo(20,15);ctx.lineTo(58,250);ctx.lineTo(-58,250);ctx.fill()}ctx.strokeStyle='#20333f';ctx.lineWidth=3;ctx.fillStyle='#667984';ctx.beginPath();ctx.ellipse(0,7,u.r*1.15,u.r*.38,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#6ed8e8';ctx.beginPath();ctx.arc(0,0,u.r*.58,Math.PI,0);ctx.fill();ctx.stroke();ctx.restore()}
function drawGround(g){let q=scr(g);if(q.x<-100||q.x>W+100||q.y<-100||q.y>H+100)return;outline(q,g.r*1.4,g.r,'#ef4d57');ctx.save();ctx.translate(q.x,q.y);ctx.strokeStyle='#1e2b26';ctx.lineWidth=3;if(g.kind==='alligator'){ctx.fillStyle='#4b8d3c';ctx.beginPath();ctx.ellipse(0,0,38,16,0,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(25,-6);ctx.lineTo(58,-4);ctx.lineTo(30,7);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#f3e98d';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(28+i*7,-3);ctx.lineTo(31+i*7,3);ctx.lineTo(34+i*7,-3);ctx.fill()}}else if(g.kind==='gorilla'){ctx.fillStyle='#25272b';ctx.beginPath();ctx.arc(0,-10,20,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(0,14,26,22,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#5b4a41';ctx.beginPath();ctx.ellipse(3,-7,12,9,0,0,7);ctx.fill()}else if(g.kind==='soldier'){ctx.fillStyle='#537247';ctx.fillRect(-13,-5,26,34);ctx.strokeRect(-13,-5,26,34);ctx.beginPath();ctx.arc(0,-15,12,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#303c2b';ctx.fillRect(-15,-28,30,10)}else{ctx.fillStyle='#4d5d3e';ctx.fillRect(-35,-8,70,25);ctx.strokeRect(-35,-8,70,25);ctx.fillRect(-15,-24,30,18);ctx.strokeRect(-15,-24,30,18);ctx.fillRect(8,-20,45,6)}ctx.restore()}
function drawBoat(b){let q=scr({x:b.x,y:b.y+Math.sin(b.ph)*2}),w=b.type==='sail'?150:125;if(q.x+w<-80||q.x>W+80||q.y<-160||q.y>H+70)return;outline({x:q.x+w/2,y:q.y},w*.58,32,'#ef4d57');ctx.save();ctx.translate(q.x,q.y);if(b.dir<0){ctx.translate(w,0);ctx.scale(-1,1)}ctx.strokeStyle='#263b49';ctx.lineWidth=3;ctx.fillStyle='#2d5268';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w,0);ctx.lineTo(w-25,28);ctx.lineTo(20,28);ctx.closePath();ctx.fill();ctx.stroke();if(b.type==='sail'){ctx.strokeStyle='#76533a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(w*.52,0);ctx.lineTo(w*.52,-100);ctx.stroke();ctx.fillStyle='#fff8e6';ctx.beginPath();ctx.moveTo(w*.55,-95);ctx.lineTo(w*.55,-8);ctx.lineTo(w*.92,-8);ctx.closePath();ctx.fill();ctx.stroke()}else{ctx.fillStyle='#ed604a';ctx.fillRect(22,-8,70,8)}ctx.restore()}
function drawPlane(pl){let q=scr(pl);if(q.x<-220||q.x>W+220||q.y<-80||q.y>H+80)return;outline(q,78,22,'#ef4d57');ctx.save();ctx.translate(q.x,q.y);ctx.fillStyle='#8a959d';ctx.strokeStyle='#334756';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,68,11,0,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(-35,-30);ctx.lineTo(18,-5);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function drawEffects(){for(let p0 of parts){let q=scr(p0);ctx.globalAlpha=C(p0.life,0,1);ctx.fillStyle=p0.col;ctx.beginPath();ctx.arc(q.x,q.y,3+p0.life*2,0,7);ctx.fill()}ctx.globalAlpha=1;for(let l of lasers){let a=scr({x:l.x1,y:l.y1}),b=scr({x:l.x2,y:l.y2});ctx.save();ctx.globalAlpha=C(l.life/.14,0,1);ctx.strokeStyle='#8cff6a';ctx.lineWidth=5;ctx.shadowColor='#b7ff9f';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(a.x+20,a.y-8);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}}
function draw(){ctx.clearRect(0,0,W,H);bg();for(let f of foods)drawFood(f);for(let b of boats)drawBoat(b);for(let g of grounds)drawGround(g);for(let pl of planes)drawPlane(pl);for(let u of ufos)drawUfo(u);for(let e of enemies)drawEnemy(e);drawEffects();drawPlayer()}
function loop(now){let dt=Math.min(.02,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
